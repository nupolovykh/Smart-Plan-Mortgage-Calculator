name: Dependabot auto-merge

# CI runs on the pull request itself; this workflow waits for that run to finish
# and merges only when it passed. It cannot be done from the pull_request event:
# a run raised by Dependabot gets a read-only token, so the merge has to happen
# from a workflow_run job, which executes in the context of the default branch
# with write access.
#
# There is no semver filter. A bump that breaks the build fails CI and is
# therefore never merged — the same outcome as filtering patch/minor, by a
# shorter and more honest route.

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    runs-on: ubuntu-latest
    steps:
      - name: Merge the pull request if it targets the dependency branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          number=$(gh api "repos/$REPO/commits/$HEAD_SHA/pulls" \
            --jq '.[]
                  | select(.state == "open")
                  | select(.user.login == "dependabot[bot]")
                  | select(.base.ref == "security-features-main")
                  | .number' | head -n1)

          if [ -z "$number" ]; then
            echo "No open pull request against security-features-main for $HEAD_SHA."
            exit 0
          fi

          echo "CI passed on $HEAD_SHA; merging #$number into security-features-main."
          gh pr merge --squash --delete-branch --repo "$REPO" "$number"
