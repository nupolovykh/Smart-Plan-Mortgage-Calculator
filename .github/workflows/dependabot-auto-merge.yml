name: Dependabot auto-merge

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  auto-merge:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'pull_request' &&
       startsWith(github.event.workflow_run.head_branch, 'dependabot/'))
    runs-on: ubuntu-latest
    steps:
      - name: Merge every dependency pull request whose checks have passed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BASE: security-features-main
        run: |
          set -uo pipefail

          merge_pr() {
            local number="$1" sha="$2" method
            for method in squash merge rebase; do
              if gh api --method PUT "repos/$REPO/pulls/$number/merge" \
                   -f merge_method="$method" -f sha="$sha" >/dev/null 2>&1; then
                echo "#$number merged ($method)."
                ref=$(gh api "repos/$REPO/pulls/$number" --jq '.head.ref')
                gh api --method DELETE "repos/$REPO/git/refs/heads/$ref" >/dev/null 2>&1 \
                  || echo "::warning::merged #$number but could not delete $ref."
                return 0
              fi
              echo "#$number: $method merge refused."
            done
            return 1
          }

          open=$(gh api --paginate \
                   "repos/$REPO/pulls?state=open&base=$BASE&per_page=100" \
                   --jq '.[]
                         | select(.user.login == "dependabot[bot]")
                         | select(.head.ref | startswith("dependabot/"))
                         | "\(.number)\t\(.head.sha)"')

          if [ -z "$open" ]; then
            echo "No open dependency pull requests."
            exit 0
          fi

          stuck=0
          while IFS=$'\t' read -r number sha; do
            [ -n "$number" ] || continue

            state=$(gh api "repos/$REPO/pulls/$number" --jq '.mergeable_state')
            if [ "$state" = "dirty" ]; then
              echo "#$number conflicts with $BASE; leaving it for Dependabot to rebase."
              continue
            fi

            checks=$(gh api "repos/$REPO/commits/$sha/check-runs" --paginate \
                       --jq '.check_runs[] | select(.name != "auto-merge") | "\(.status):\(.conclusion)"')

            if [ -z "$checks" ]; then
              echo "#$number has no checks yet; skipping."
              continue
            fi
            if grep -qv '^completed:' <<<"$checks"; then
              echo "#$number still has checks running; skipping."
              continue
            fi
            if grep -qvE '^completed:(success|skipped|neutral)$' <<<"$checks"; then
              echo "#$number has a failing check; leaving it open."
              continue
            fi

            behind=$(gh api "repos/$REPO/compare/$BASE...$sha" --jq '.behind_by')
            if [ "${behind:-0}" -gt 0 ]; then
              echo "#$number is $behind commits behind $BASE."
              if gh api --method PUT "repos/$REPO/pulls/$number/update-branch" >/dev/null 2>&1; then
                echo "#$number branch updated; it merges once CI has run on the new head."
                continue
              fi
              echo "#$number could not be updated; merging it as it stands."
            fi

            merge_pr "$number" "$sha" || {
              echo "::error::#$number passed CI and cannot be merged by GITHUB_TOKEN."
              stuck=$((stuck + 1))
            }
          done <<<"$open"

          exit $(( stuck > 0 ))
