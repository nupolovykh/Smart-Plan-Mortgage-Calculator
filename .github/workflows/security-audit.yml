name: Security audit

# Deliberately NOT part of CI.
#
# An audit answers a question about the global advisory database, not about the
# commit under test. A newly published advisory turns every open pull request red
# at once — including the very bump that fixes it — and in a repository where
# green CI is what merges updates, that stops the updates from landing exactly
# when they matter most. Here it reports on a schedule and blocks nothing.
#
# It is also the one workflow that speaks about `main` itself: Dependabot's
# security updates are switched off in this repository, so this report is the
# only place the whole picture is written down.
#
# The report is the run's summary and its warnings, not an issue. An issue stays
# open until every advisory is fixed, which for coursework may be never, and it
# is one more thing a human has to close. The summary is on the Actions tab of
# every run, and a finding never fails the run.

on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - run: npm ci
        working-directory: frontend

      - run: composer install --no-interaction --prefer-dist
        working-directory: backend

      - name: Audit both ecosystems
        run: |
          # Explicit: the step's shell is `bash -e`, and this script handles its
          # own failures rather than dying at the first one.
          set +e
          set -uo pipefail
          affected=0
          details=""

          # `if` context, not a bare assignment: both auditors exit non-zero
          # precisely when they find something, and under `bash -e` a bare
          # assignment would kill the script on the first finding, before
          # anything could be reported.
          echo "::group::npm audit (high and above)"
          if npm_report=$(cd frontend && npm audit --audit-level=high 2>&1); then
            npm_rc=0
          else
            npm_rc=$?
          fi
          printf '%s\n' "$npm_report"
          echo "::endgroup::"

          echo "::group::composer audit"
          if composer_report=$(cd backend && composer audit --no-interaction 2>&1); then
            composer_rc=0
          else
            composer_rc=$?
          fi
          printf '%s\n' "$composer_report"
          echo "::endgroup::"

          if [ "$npm_rc" -ne 0 ]; then
            affected=$((affected + 1))
            line=$(grep -E '[0-9]+ (vulnerabilit|high|critical)' <<<"$npm_report" | tail -1)
            details="${details}
          - \`frontend\` (npm) — ${line:-see the run log}"
            echo "::warning::advisories at high or above in frontend"
          fi

          if [ "$composer_rc" -ne 0 ]; then
            affected=$((affected + 1))
            line=$(grep -E 'Found [0-9]+' <<<"$composer_report" | tail -1)
            details="${details}
          - \`backend\` (composer) — ${line:-see the run log}"
            echo "::warning::advisories in backend"
          fi

          # A finding never fails the run: this workflow runs on a schedule
          # against the default branch, so a failure would pin a red check to
          # whatever commit that branch points at — permanently, since a check run
          # cannot be deleted and the mark outlives the fix.
          if [ "$affected" -gt 0 ]; then
            detail="${affected} of 2 ecosystems carry advisories."
          else
            detail="Nothing at high or above in either ecosystem."
          fi
          echo "$detail"

          {
            echo "### Security audit"
            echo
            echo "${detail}"
            if [ -n "${details}" ]; then printf '%s\n' "${details}"; fi
          } >>"$GITHUB_STEP_SUMMARY"
