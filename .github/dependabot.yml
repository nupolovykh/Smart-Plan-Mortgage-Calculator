# Version updates land on `deps`, never on main. Each pull request merges itself
# once CI is green on that exact commit; the collected result reaches main only
# through one promotion pull request that a human merges.
#
# Monthly, one pull request per directory for every minor and patch bump, and
# one pull request per major. Minor and patch bumps rarely break anything, so
# grouping them costs little and cuts the noise to one pull request a month.
# Majors stay separate, so a major that breaks the build blocks only itself.
#
# Packages that must move together get their own group across all update
# types, so a major of one never arrives without the others: React with its
# DOM renderer and type packages, ESLint with its plugins and typescript-eslint,
# Vite with its plugins. minor-and-patch excludes the families' patterns:
# without that, one scan could raise the same line in two groups, and whichever
# pull request merged second would conflict.
#
# 99 means "no limit". Every update lands on `deps`, where a red one blocks
# nothing. The key cannot be dropped to mean "unlimited": omitting it applies
# Dependabot's default of 5, and 0 switches version updates off altogether.
#
# Dependabot security updates are switched off for this repository: they always
# target main and would bypass `deps`. security-audit.yml reports advisories
# instead — see docs/dependency-updates.md.
version: 2

updates:
  - package-ecosystem: "composer"
    directory: "/backend"
    schedule:
      interval: "monthly"
    target-branch: "deps"
    open-pull-requests-limit: 99
    labels: ["dependencies"]
    commit-message:
      prefix: "build(deps)"
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    target-branch: "deps"
    open-pull-requests-limit: 99
    labels: ["dependencies"]
    commit-message:
      prefix: "build(deps)"
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      eslint:
        patterns: ["eslint", "@eslint/*", "eslint-plugin-*", "typescript-eslint"]
      vite:
        patterns: ["vite", "@vitejs/*"]
      minor-and-patch:
        patterns: ["*"]
        exclude-patterns: ["react", "react-dom", "@types/react", "@types/react-dom", "eslint", "@eslint/*", "eslint-plugin-*", "typescript-eslint", "vite", "@vitejs/*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    target-branch: "deps"
    open-pull-requests-limit: 99
    labels: ["dependencies"]
    commit-message:
      prefix: "ci(actions)"
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
